<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulberry Luna — 데모</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-size: 20px;
    color: #1a1a1a;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #top-nav {
    width: 100%;
    padding: 10px 20px;
    display: flex;
    gap: 20px;
    font-size: 13px;
  }

  #top-nav a {
    color: #6b7280;
    text-decoration: none;
    letter-spacing: -0.2px;
  }

  #top-nav a:hover { color: #2d6a4f; text-decoration: underline; }

  header {
    width: 100%;
    max-width: 760px;
    padding: 12px 24px 16px;
    text-align: center;
  }

  header h1 {
    font-size: 26px;
    font-weight: 700;
    color: #2d6a4f;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 16px;
    color: #6b7280;
    margin-top: 6px;
  }

  #chat-area {
    flex: 1;
    width: 100%;
    max-width: 760px;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .bubble {
    max-width: 72%;
    padding: 16px 20px;
    border-radius: 20px;
    line-height: 1.6;
    font-size: 20px;
    word-break: keep-all;
  }

  .bubble.luna {
    background: transparent;
    border: none;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .bubble.user {
    background: #2d6a4f;
    color: #ffffff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .bubble .sender {
    font-size: 13px;
    font-weight: 600;
    color: #52b788;
    margin-bottom: 6px;
  }

  .bubble.user .sender { display: none; }

  #input-bar {
    width: 100%;
    max-width: 760px;
    padding: 16px 24px 32px;
    display: flex;
    gap: 12px;
  }

  #msg-input {
    flex: 1;
    border: 2px solid #d1d5db;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 20px;
    font-family: inherit;
    outline: none;
    resize: none;
    min-height: 56px;
    max-height: 140px;
    transition: border-color 0.2s;
  }

  #msg-input:focus { border-color: #2d6a4f; }

  #send-btn {
    background: #2d6a4f;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 22px;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s;
    align-self: flex-end;
    min-width: 80px;
  }

  #send-btn:hover { background: #1b4332; }
  #send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 18px;
  }

  .typing span {
    width: 8px;
    height: 8px;
    background: #52b788;
    border-radius: 50%;
    animation: bounce 1s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  .error-msg {
    background: #fff1f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 16px;
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0; }
  .bubble li { margin: 2px 0; }
  .bubble strong { font-weight: 700; }
  .bubble hr { border: none; border-top: 1px solid #d1fae5; margin: 10px 0; }
  .bubble table { border-collapse: collapse; width: 100%; font-size: 17px; }
  .bubble th, .bubble td { border: 1px solid #b7e4c7; padding: 6px 10px; }
  .bubble th { background: #d8f3dc; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
.bubble.luna table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 18px; }
.bubble.luna th, .bubble.luna td { border: 1px solid #b7e4c7; padding: 8px 12px; text-align: left; }
.bubble.luna th { background: #d8f3dc; font-weight: 600; }
.bubble.luna strong { font-weight: 700; }
.bubble.luna p { margin: 4px 0; }
.bubble.luna li { margin-left: 20px; }
</style>
</head>
<body>

<nav id="top-nav">
  <a href="https://github.com/wooriapt79/mulberry-" target="_blank">저장소</a>
  <a href="https://github.com/wooriapt79/mulberry_ecosystem_AgenticAI" target="_blank">에이전시 에이전트</a>
  <a href="https://railway.com/project/ca649fc8-6eef-4620-8638-a5b5aeda27b9" target="_blank">대시보드</a>
</nav>

<header>
  <h1>🌿 Mulberry Luna</h1>
  <p>전국 지자체 지역 AI 서비스 파일럿</p>
</header>

<div id="chat-area">
  <div class="bubble luna">
    <div class="sender">Luna</div>
    안녕하세요! 저는 Mulberry AI 에이전트 Luna입니다.<br>
    지역 주민 여러분의 생활 편의와 복지를 위해 활동하고 있어요.<br>
    궁금하신 점을 편하게 말씀해 주세요 😊
  </div>
</div>

<div id="input-bar">
  <textarea id="msg-input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
  <button id="send-btn">전송</button>
</div>

<script>
  const chatArea = document.getElementById('chat-area');
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  function appendBubble(text, role, isError) {
    const div = document.createElement('div');
    div.className = 'bubble ' + role + (isError ? ' error-msg' : '');
    if (role === 'luna') {
      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = 'Luna';
      div.appendChild(sender);
    }
    if (role === 'luna') {
  const content = document.createElement('div');
  content.innerHTML = marked.parse(text);
  div.appendChild(content);
} else {
  div.appendChild(document.createTextNode(text));
}
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'bubble luna';
    div.id = 'typing-indicator';
    div.innerHTML = '<div class="sender">Luna</div><div class="typing"><span></span><span></span><span></span></div>';
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendBubble(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/demo/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      removeTyping();

      if (res.status === 422) {
        appendBubble('개인정보(전화번호, 이메일 등)는 입력하지 마세요.', 'luna', true);
      } else if (res.status === 429) {
        appendBubble('요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.', 'luna', true);
      } else if (!res.ok) {
        appendBubble('일시적인 오류가 발생했습니다. 다시 시도해 주세요.', 'luna', true);
      } else {
        const data = await res.json();
        appendBubble(data.reply, 'luna');
      }
    } catch {
      removeTyping();
      appendBubble('연결 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.', 'luna', true);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
</script>
</body>
</html>
