<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>제안서 피드백 검토함 · Mulberry Lab</title>
<style>
:root{--purple:#7c3aed;--purple-soft:#f5f3ff;--line:#e5e7eb;--text:#18181b;--muted:#6b7280;--bg:#f8fafc;--white:#fff;--green:#166534;--amber:#92400e;--red:#991b1b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.shell{max-width:1180px;margin:0 auto;padding:24px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:24px;margin:0 0 6px}
.subtitle{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--white);color:var(--text);border-radius:8px;padding:9px 13px}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 28px rgba(15,23,42,.05)}
.login{max-width:440px;margin:10vh auto}
.login h2{margin:0 0 8px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.filters select,.review-note{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 11px;color:var(--text)}
.login .btn{width:100%;margin-top:18px;min-height:44px}
.message{min-height:20px;margin-top:12px;font-size:12px;color:var(--red)}
.hidden{display:none!important}
.filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat strong{display:block;font-size:22px;margin-top:4px}
.stat span{font-size:11px;color:var(--muted)}
.meta-line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0;color:var(--muted);font-size:12px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item-head{display:grid;grid-template-columns:90px 120px 110px 120px 1fr auto;gap:10px;align-items:center;padding:13px 15px}
.tag{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;background:var(--purple-soft);color:var(--purple)}
.tag.inje{background:#eff6ff;color:#1d4ed8}.tag.wanju{background:#ecfdf5;color:#047857}
.tag.received{background:#f3f4f6;color:#374151}.tag.reviewing{background:#fffbeb;color:var(--amber)}
.tag.incorporated{background:#f0fdf4;color:var(--green)}.tag.deferred{background:#fef2f2;color:var(--red)}
.question{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:var(--muted);text-align:right}
.toggle{border:0;background:transparent;color:var(--purple);font-weight:700;padding:6px}
.detail{display:none;border-top:1px solid var(--line);padding:16px}
.item.open .detail{display:block}
.detail h3{font-size:12px;margin:0 0 7px;color:var(--muted)}
.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7;margin:0 0 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.actions button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px;font-size:12px}
.actions button[data-status="reviewing"]{color:var(--amber)}
.actions button[data-status="incorporated"]{color:var(--green)}
.actions button[data-status="deferred"]{color:var(--red)}
.actions button[data-escalation="requested"]{color:var(--red)}
.review-note{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;line-height:1.6;margin:0 0 8px}
.review-tools{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.review-tools h3{margin-top:0}
.error-banner{margin-bottom:12px;padding:11px 13px;border-radius:8px;background:#fef2f2;color:var(--red);font-size:12px}
@media(max-width:820px){
 .shell{padding:16px 12px}.top{flex-direction:column}.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}
 .item-head{grid-template-columns:70px 90px 1fr auto}.item-head .category,.item-head .source{display:none}.time{grid-column:1/-1;text-align:left}
}
@media(max-width:480px){.filters{grid-template-columns:1fr}.top-actions{width:100%}.top-actions .btn{flex:1}}
</style>
</head>
<body>
<div class="shell">
<section id="loginView" class="panel login">
<h2>제안서 피드백 검토함</h2>
<p class="subtitle">승인된 관리자 또는 검토자 계정으로 로그인하세요.</p>
<form id="loginForm">
<div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="12" required></div>
<button class="btn primary" type="submit">로그인</button>
<div class="message" id="loginMessage" role="alert"></div>
</form>
</section>
<section id="reviewView" class="hidden">
<div class="top">
<div><h1>제안서 피드백 검토함</h1><p class="subtitle">인제·완주 Q&A와 파일 분석에서 접수된 검토자료입니다. 제안서 반영은 Human Approval 후 처리하세요.</p></div>
<div class="top-actions"><button class="btn" id="exportBtn" type="button">CSV 내보내기</button><button class="btn" id="refreshBtn" type="button">새로고침</button><button class="btn" id="logoutBtn" type="button">로그아웃</button></div>
</div>
<div id="errorBanner" class="error-banner hidden" role="alert"></div>
<div class="filters">
<select id="regionFilter" aria-label="지자체"><option value="">전체 지자체</option><option value="inje">인제</option><option value="wanju">완주</option></select>
<select id="statusFilter" aria-label="처리 상태"><option value="">전체 상태</option><option value="received">접수</option><option value="reviewing">검토 중</option><option value="incorporated">반영</option><option value="deferred">보류</option></select>
<select id="categoryFilter" aria-label="분류"><option value="">전체 분류</option><option value="budget">예산</option><option value="schedule">일정</option><option value="kpi">KPI</option><option value="governance">거버넌스</option><option value="evidence">근거자료</option><option value="general">일반</option></select>
<select id="typeFilter" aria-label="요청 유형"><option value="">전체 유형</option><option value="proposal_update">제안서 수정요청</option><option value="question">일반 질문</option></select>
<select id="escalationFilter" aria-label="Human 연결"><option value="">전체 Human 연결</option><option value="none">연결 없음</option><option value="requested">연결 요청</option><option value="resolved">연결 완료</option></select>
<label class="check"><input id="candidateOnly" type="checkbox"> 제안서 반영 후보만</label>
<label class="check"><input id="todayOnly" type="checkbox" checked> 오늘 접수만 보기</label>
</div>
<div class="stats">
<div class="stat"><span>조회 건수</span><strong id="totalCount">0</strong></div>
<div class="stat"><span>수정요청</span><strong id="updateCount">0</strong></div>
<div class="stat"><span>접수</span><strong id="receivedCount">0</strong></div>
<div class="stat"><span>검토 중</span><strong id="reviewingCount">0</strong></div>
</div>
<div class="meta-line"><span id="scopeLabel">최근 200건 기준</span><span id="loadedAt"></span></div>
<div id="feedbackList" class="list" aria-live="polite"></div>
</section>
</div>
<script>
const TOKEN_KEY='proposal_review_token';
const statusLabels={received:'접수',reviewing:'검토 중',incorporated:'반영',deferred:'보류'};
const categoryLabels={budget:'예산',schedule:'일정',kpi:'KPI',governance:'거버넌스',evidence:'근거자료',general:'일반'};
const sourceLabels={chat:'Q&A',file_analysis:'파일 분석'};
const escalationLabels={none:'연결 없음',requested:'Human 연결 요청',resolved:'연결 완료'};
const loginView=document.getElementById('loginView');
const reviewView=document.getElementById('reviewView');
const loginMessage=document.getElementById('loginMessage');
const errorBanner=document.getElementById('errorBanner');
let records=[];
const noteDrafts=new Map();
let activeFeedbackController=null;
let feedbackRequestSequence=0;

function token(){return sessionStorage.getItem(TOKEN_KEY)||''}
function showLogin(message=''){
 sessionStorage.removeItem(TOKEN_KEY);
 loginView.classList.remove('hidden');
 reviewView.classList.add('hidden');
 loginMessage.textContent=message;
}
function showReview(){
 loginView.classList.add('hidden');
 reviewView.classList.remove('hidden');
}
function authHeaders(extra={}){return Object.assign({'Authorization':'Bearer '+token()},extra)}
function todayStartIso(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString()}
function queryString(){
 const params=new URLSearchParams();
 const fields=[['region','regionFilter'],['review_status','statusFilter'],['category','categoryFilter'],['request_type','typeFilter'],['escalation_status','escalationFilter']];
 fields.forEach(([key,id])=>{const value=document.getElementById(id).value;if(value)params.set(key,value)});
 if(document.getElementById('candidateOnly').checked)params.set('candidate_only','true');
 if(document.getElementById('todayOnly').checked)params.set('created_from',todayStartIso());
 return params.toString();
}
function setError(message){
 errorBanner.textContent=message;
 errorBanner.classList.toggle('hidden',!message);
}
function el(tag,className,text){
 const node=document.createElement(tag);
 if(className)node.className=className;
 if(text!==undefined)node.textContent=text;
 return node;
}
function formatTime(value){
 if(!value)return '-';
 return new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short'}).format(new Date(value));
}
function updateStats(){
 document.getElementById('totalCount').textContent=records.length;
 document.getElementById('updateCount').textContent=records.filter(x=>x.request_type==='proposal_update').length;
 document.getElementById('receivedCount').textContent=records.filter(x=>x.status==='received').length;
 document.getElementById('reviewingCount').textContent=records.filter(x=>x.status==='reviewing').length;
}
function render(){
 const list=document.getElementById('feedbackList');
 list.replaceChildren();
 updateStats();
 if(!records.length){list.appendChild(el('div','empty','조건에 맞는 접수자료가 없습니다.'));return}
 records.forEach(record=>{
  const item=el('article','item');
  const head=el('div','item-head');
  head.appendChild(el('span','tag '+record.region,record.region==='inje'?'인제':'완주'));
  head.appendChild(el('span','tag '+record.status,statusLabels[record.status]||record.status));
  head.appendChild(el('span','category tag',categoryLabels[record.category]||record.category));
  head.appendChild(el('span','source tag',sourceLabels[record.source]||record.source));
  head.appendChild(el('div','question',record.question));
  const toggle=el('button','toggle','상세');
  toggle.type='button';
  toggle.setAttribute('aria-expanded','false');
  head.appendChild(toggle);
  head.appendChild(el('div','time',formatTime(record.created_at)));
  const detail=el('div','detail');
  detail.appendChild(el('h3','',record.request_type==='proposal_update'?'제안서 수정요청':'질문'));
  detail.appendChild(el('p','content',record.question));
  detail.appendChild(el('h3','','Luna 답변·분석 결과'));
  detail.appendChild(el('p','content',record.response));
  const reviewTools=el('div','review-tools');
  reviewTools.appendChild(el('h3','','담당자 검토 메모'));
  const note=document.createElement('textarea');
  const existingDraft=noteDrafts.get(record.id);
  note.className='review-note';note.maxLength=2000;
  note.value=existingDraft?existingDraft.value:(record.reviewer_note||'');
  note.dataset.baseRevision=existingDraft?existingDraft.baseRevision:record.review_revision;
  note.setAttribute('aria-label','담당자 검토 메모');
  reviewTools.appendChild(note);
  const noteActions=el('div','actions');
  const saveNote=el('button','','메모 저장');saveNote.type='button';
  saveNote.disabled=!(existingDraft&&existingDraft.dirty);
  note.addEventListener('input',()=>{
   noteDrafts.set(record.id,{value:note.value,baseRevision:note.dataset.baseRevision,dirty:true});
   saveNote.disabled=false;
  });
  saveNote.addEventListener('click',async()=>{
   saveNote.disabled=true;
   try{
    await updateReview(record.id,{
     reviewer_note:note.value,
     review_revision:note.dataset.baseRevision
    },true);
   }
   catch(error){setError('메모가 저장되지 않았습니다. '+error.message);saveNote.disabled=false}
  });
  noteActions.appendChild(saveNote);
  ['requested','resolved','none'].forEach(next=>{
   const button=el('button','',escalationLabels[next]);button.type='button';
   button.dataset.escalation=next;button.disabled=record.escalation_status===next;
   button.addEventListener('click',async()=>{
    button.disabled=true;
    try{
    const draft=noteDrafts.get(record.id);
    const payload={escalation_status:next};
    if(draft&&draft.dirty){
     payload.reviewer_note=draft.value;
     payload.review_revision=draft.baseRevision;
    }
    await updateReview(record.id,payload,Boolean(draft&&draft.dirty));
   }
    catch(error){setError('Human 연결 상태가 저장되지 않았습니다. '+error.message);button.disabled=record.escalation_status===next}
   });
   noteActions.appendChild(button);
  });
  reviewTools.appendChild(noteActions);detail.appendChild(reviewTools);
  const actions=el('div','actions');
  ['received','reviewing','incorporated','deferred'].forEach(next=>{
   const button=el('button','',statusLabels[next]);
   button.type='button';button.dataset.status=next;button.disabled=record.status===next;
   button.addEventListener('click',async()=>{
    button.disabled=true;
    try{
    const draft=noteDrafts.get(record.id);
    const payload={status:next};
    if(draft&&draft.dirty){
     payload.reviewer_note=draft.value;
     payload.review_revision=draft.baseRevision;
    }
    await updateReview(record.id,payload,Boolean(draft&&draft.dirty));
   }
    catch(error){setError('상태가 저장되지 않았습니다. '+error.message);button.disabled=record.status===next}
   });
   actions.appendChild(button);
  });
  detail.appendChild(actions);
  toggle.addEventListener('click',()=>{
   const open=item.classList.toggle('open');
   toggle.textContent=open?'접기':'상세';
   toggle.setAttribute('aria-expanded',String(open));
  });
  item.appendChild(head);item.appendChild(detail);list.appendChild(item);
 });
}
async function loadFeedback(){
 setError('');
 const requestSequence=++feedbackRequestSequence;
 if(activeFeedbackController)activeFeedbackController.abort();
 const controller=new AbortController();
 activeFeedbackController=controller;
 try{
  const response=await fetch('/api/proposal-feedback?'+queryString(),{headers:authHeaders(),cache:'no-store',signal:controller.signal});
  if(requestSequence!==feedbackRequestSequence)return;
  if(response.status===401||response.status===403){showLogin('세션이 만료됐거나 검토 권한이 없습니다.');return}
  if(!response.ok)throw new Error('접수자료를 불러오지 못했습니다.');
  const nextRecords=await response.json();
  if(requestSequence!==feedbackRequestSequence)return;
  records=nextRecords;
  showReview();render();
  document.getElementById('scopeLabel').textContent=(document.getElementById('todayOnly').checked?'오늘 접수 · ':'')+'최근 200건 기준';
  document.getElementById('loadedAt').textContent='확인 '+formatTime(new Date().toISOString());
 }catch(error){
  if(error.name==='AbortError')return;
  throw error;
 }finally{
  if(requestSequence===feedbackRequestSequence)activeFeedbackController=null;
 }
}
async function updateReview(id,payload,clearDraft=false){
 setError('');
 const response=await fetch('/api/proposal-feedback/'+encodeURIComponent(id),{
  method:'PATCH',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(payload)
 });
 if(response.status===401||response.status===403){showLogin('세션이 만료됐거나 검토 권한이 없습니다.');return}
 if(response.status===409)throw new Error('다른 검토자가 메모를 변경했습니다. 작성 중인 메모는 보존됩니다. 새로고침 후 다시 확인해 주세요.');
 if(!response.ok)throw new Error('처리 상태를 변경하지 못했습니다.');
 if(clearDraft)noteDrafts.delete(id);
 await loadFeedback();
}
document.getElementById('loginForm').addEventListener('submit',async event=>{
 event.preventDefault();loginMessage.textContent='확인 중입니다.';
 try{
  const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
  if(!response.ok){loginMessage.textContent='로그인 정보 또는 권한을 확인해 주세요.';return}
  const data=await response.json();sessionStorage.setItem(TOKEN_KEY,data.access_token);
  document.getElementById('password').value='';loginMessage.textContent='';await loadFeedback();
 }catch(error){loginMessage.textContent='로그인 요청을 처리하지 못했습니다.'}
});
document.getElementById('exportBtn').addEventListener('click',async()=>{
 setError('');
 const button=document.getElementById('exportBtn');button.disabled=true;
 try{
  const response=await fetch('/api/proposal-feedback/export?'+queryString(),{headers:authHeaders(),cache:'no-store'});
  if(response.status===401||response.status===403){showLogin('세션이 만료됐거나 검토 권한이 없습니다.');return}
  if(!response.ok)throw new Error('CSV 파일을 만들지 못했습니다.');
  const blob=await response.blob();const url=URL.createObjectURL(blob);
  const link=document.createElement('a');link.href=url;link.download='proposal-feedback.csv';
  document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
 }catch(error){setError(error.message)}finally{button.disabled=false}
});
document.getElementById('refreshBtn').addEventListener('click',()=>loadFeedback().catch(e=>setError(e.message)));
document.getElementById('logoutBtn').addEventListener('click',async()=>{
 try{await fetch('/auth/logout',{method:'POST',headers:authHeaders()})}finally{showLogin('로그아웃했습니다.')}
});
['regionFilter','statusFilter','categoryFilter','typeFilter','escalationFilter','candidateOnly','todayOnly'].forEach(id=>document.getElementById(id).addEventListener('change',()=>loadFeedback().catch(e=>setError(e.message))));
if(token())loadFeedback().catch(e=>{showReview();setError(e.message)});else showLogin();
</script>
</body>
</html>
