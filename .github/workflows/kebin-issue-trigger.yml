name: KeBin Issue Trigger

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to validate without posting
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: kebin-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  receive:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !github.event.issue.pull_request &&
        (
          (github.event_name == 'issues' && contains(github.event.issue.body || '', '#KeBin')) ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '#KeBin'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate or register KeBin request
        uses: actions/github-script@v7
        env:
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const manual = context.eventName === 'workflow_dispatch';
            const issueNumber = manual
              ? Number(process.env.MANUAL_ISSUE_NUMBER)
              : context.issue.number;

            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('A valid issue number is required.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            if (issue.pull_request) {
              core.notice('Pull requests are outside this trigger scope.');
              return;
            }

            if (manual) {
              core.notice(`Issue #${issueNumber} is reachable. Manual validation does not modify it.`);
              return;
            }

            const source = context.eventName === 'issue_comment'
              ? context.payload.comment.body
              : issue.body || '';

            if (!source.includes('#KeBin')) {
              core.notice('No exact #KeBin trigger found.');
              return;
            }

            const sourceId = context.eventName === 'issue_comment'
              ? `comment-${context.payload.comment.id}`
              : `issue-${issue.id}-${context.payload.issue.updated_at}`;
            const marker = `<!-- kebin-trigger:${sourceId} -->`;

            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );

            if (existing.some((comment) => comment.body?.includes(marker))) {
              core.notice('This KeBin trigger event was already registered.');
              return;
            }

            const labelName = 'kebin-task';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: '6f42c1',
                description: 'Work request received through the #KeBin issue trigger',
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [labelName],
            });

            const sourceUrl = context.eventName === 'issue_comment'
              ? context.payload.comment.html_url
              : issue.html_url;
            const requester = context.actor;
            const receivedAt = new Date().toISOString();

            const body = [
              marker,
              '## KeBin 작업 요청 접수',
              '',
              `- Issue: #${issueNumber}`,
              `- 요청자: @${requester}`,
              `- 접수 시각: ${receivedAt}`,
              `- 원문: ${sourceUrl}`,
              '',
              '요청을 작업 대기열에 등록했습니다. 실제 코드 변경, 외부 배포, 결제 및 메시지 전송은 별도의 Human 승인과 Draft PR 절차를 따릅니다.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
