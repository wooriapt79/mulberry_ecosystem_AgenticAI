name: Open Reception Security

on:
  pull_request:
    paths:
      - "open-reception/**"
      - ".github/workflows/open-reception-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: open_reception_test
          POSTGRES_PASSWORD: open_reception_test
          POSTGRES_DB: open_reception_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_reception_test -d open_reception_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: open-reception

    env:
      DATABASE_URL: postgresql+psycopg://open_reception_test:open_reception_test@localhost:5432/open_reception_test
      ADMIN_BOOTSTRAP_TOKEN: bootstrap-token-for-ci-only-000000000
      LOGIN_MAX_FAILURES: "3"
      LOGIN_LOCKOUT_MINUTES: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: open-reception/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm PostgreSQL test target
        run: |
          python - <<'PY'
          import os
          assert os.environ["DATABASE_URL"].startswith("postgresql+psycopg://")
          PY

      - name: Upgrade database migrations
        run: python -m alembic upgrade head

      - name: Run full PostgreSQL suite
        run: python -m pytest -q

      - name: Run concurrency gates explicitly
        run: |
          python -m pytest -q \
            tests/test_security.py::test_postgresql_failed_login_increment_is_atomic \
            tests/test_security.py::test_postgresql_bootstrap_claim_is_atomic

      - name: Verify PostgreSQL migration round trip
        run: python scripts/verify_migration_roundtrip.py
