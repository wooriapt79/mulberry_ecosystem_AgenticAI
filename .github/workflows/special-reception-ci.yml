name: Special Reception Phase A

on:
  pull_request:
    paths:
      - "special-reception/**"
      - "docs/special-reception-**"
      - ".github/workflows/special-reception-ci.yml"
  push:
    branches: [main]
    paths:
      - "special-reception/**"
      - "docs/special-reception-**"
      - ".github/workflows/special-reception-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-reception-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rules, API and boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: special-reception
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: special-reception/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install --requirement requirements-dev.txt
      - name: Run unit and policy-boundary tests
        env:
          SESSION_SIGNING_SECRET: ci-only-secret-that-is-not-used-outside-tests
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js

  container:
    name: Container build and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag special-reception:ci special-reception
      - name: Start isolated container
        run: |
          docker run --detach --rm \
            --name special-reception-ci \
            --publish 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --env SESSION_SIGNING_SECRET=ci-only-secret-that-is-not-used-outside-tests \
            special-reception:ci
      - name: Verify health and catalog
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status":"ok"'; then
              curl --fail --silent http://127.0.0.1:18080/api/catalog | grep -q '"personas"'
              exit 0
            fi
            sleep 1
          done
          docker logs special-reception-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker stop special-reception-ci || true
